<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun Sayangku</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
       <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
</head>
<body style="background-image: url(https://plus.unsplash.com/premium_photo-1689518469262-6f9499412ef0?q=80&w=1145&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);"class="flex justify-center h-screen items-center"

>

<div class="bg-white border px-10 py-8 border-4 border-red-300
shadow-red-400 rounded-xl text-center animate__animated animate__fadeInDown m-8 w-80" id="kartu">
    <h1 class="text-3xl">Happy Birthday</h1>
    <h1 class="text-4xl text-yellow-500 font-bold  animate__animated animate__pulse animate__infinite">Irianti</h1>
    <button class="p-2 bg-yellow-300 text-white rounded mt-5 hover:bg-yellow-700 transition ease-in w-full animate__animated animate__delay-1s animate__tada" onclick="ubahkartu()">Click here</button>
    
<script
    src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.4.0/tsparticles.confetti.bundle.min.js"></script>
 <script>
confetti({
  particleCount: 100,
  spread: 70,
  origin: { y: .6 }
});
let kartu = document.getElementById("kartu")
function ubahkartu() {
    kartu.innerHTML = `<h1 class="font-semibold text-warp animate__animated"
    >Untuk orang yang paling membuatku bahagia. Selamat bertambah usia sayangku. Semoga seiringnya bertambah usia, bertambah pula rasa syukur atas segala berkat didalam hidup, juga semoga segala doamu segera terkabulkan. Aku mencintaimu lebih dari yang bisa diungkapkan kata-kata.</h1>
    <h2 class="font-semibold mt-3 animate__animated animate__FadeIn">Dari Kesayanganmu, Jovan</h2>
    <button class="p-2 bg-slate-300 text-white rounded mt-5 hover:bg-slate-700 transition ease-in w-full animate__animated animate__delay-1s animate__tada" onclick="refresh()">Close</button>
    `;

    
    }
    function refresh() {
        location.reload();
}
 </script>
</html>
